<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1520">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agente Quant V2</title>
<style>
:root{--bg:#0d1520;--card:#15202e;--bd:#25354a;--tx:#e8edf3;--mut:#8497ad;--ok:#2fd28c;--bad:#ff5a6e;--acc:#f0b90b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;margin:auto}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.warn{border-color:var(--bad);color:var(--bad)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#1a1400;font-weight:600}
button.s{background:#25354a;color:var(--tx)}button.r{background:var(--bad);color:#fff}button.g{background:var(--ok);color:#04230f}
button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row>*{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:13px}
.sc{display:flex;align-items:center;gap:8px;margin-top:8px}.sc b{width:62px}.bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mut)}
.bar i.hi{background:var(--ok)}.num{width:44px;text-align:right}
details{margin-top:6px;font-size:13px;color:var(--mut)}li{margin:3px 0}
.sig{border:2px solid var(--ok);border-radius:10px;padding:10px;margin-top:10px;background:#0f2a22}
.sig table{width:100%;border-collapse:collapse}.sig td{padding:2px 0}.sig td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.v{color:var(--bad);font-size:12px}
.obs{border-left:3px solid var(--mut);padding-left:8px;margin-top:8px;font-size:13px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}table.t td,table.t th{padding:4px 2px;text-align:right}table.t td:first-child,table.t th:first-child{text-align:left}th{color:var(--mut);font-weight:500}
</style></head><body>
<div class="top"><div><h1>Agente Quant V2</h1><div class="mut" id="upd">Aguardando análise…</div></div>
<button id="go">Analisar</button></div>

<div class="card" id="dia"></div>
<div id="out"></div>
<div class="card" id="cfg"></div>
<div class="card" id="bt"></div>
<div class="card" id="hist"></div>
<p class="mut">Só avisa — não executa ordens. Você confirma e opera na Binance. Não é recomendação de investimento. Estratégia: tendência + pullback no 4H, apenas compra (spot).</p>

<script>
const CFG={symbols:["BTCUSDT","ETHUSDT"],risco:0.01,perdaMax:2,maxStops:2,maxSinais:3,scoreMin:85,rrMin:2};
const DUR4=144e5,HOSTS=["https://api.binance.com","https://data-api.binance.vision"];
const $=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let saldo=+ls.get("aq_saldo",0)||0,lastScan=0,busy=false;
CFG.scoreMin=+ls.get("aq2_min",85)||85;CFG.veto=ls.get("aq2_veto",true);
const sum=a=>a.reduce((x,y)=>x+y,0),last=(a,i=1)=>a[a.length-i];
const hoje=()=>new Date().toLocaleDateString("sv");
function load(){let s=ls.get("aq2_state",{});if(s.data!==hoje())s={data:hoje(),stops:0,pnl:0,sinais:0,ultimo:{},ultObs:{}};if(!s.ultObs)s.ultObs={};return s}
const save=s=>ls.set("aq2_state",s);
function bloqueio(s){
 if(s.stops>=CFG.maxStops)return `${s.stops} stops no dia: PARE, sem entrada nova.`;
 if(s.pnl<=-CFG.perdaMax)return `Perda do dia ${s.pnl.toFixed(2)}% atingiu o limite de ${CFG.perdaMax}%.`;
 if(s.sinais>=CFG.maxSinais)return `Limite de ${CFG.maxSinais} sinais no dia atingido.`;
 return null}

async function klines(sym,keep){let err;
 for(const h of HOSTS){try{const r=await fetch(`${h}/api/v3/klines?symbol=${sym}&interval=4h&limit=500`);
  if(!r.ok)throw new Error("HTTP "+r.status);const raw=await r.json();
  return (keep?raw:raw.slice(0,-1)).map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}))}catch(e){err=e}}
 throw new Error(`Falha ao buscar ${sym}: ${err&&err.message}`)}

function ema(v,n){const k=2/(n+1);let e=sum(v.slice(0,n))/n;const o=Array(n-1).fill(null);o.push(e);for(let i=n;i<v.length;i++){e=v[i]*k+e*(1-k);o.push(e)}return o}
function rsi(v,n=14){const o=Array(v.length).fill(null),g=[],l=[];
 for(let i=1;i<v.length;i++){g.push(Math.max(v[i]-v[i-1],0));l.push(Math.max(v[i-1]-v[i],0))}
 let ag=sum(g.slice(0,n))/n,al=sum(l.slice(0,n))/n;o[n]=al==0?100:100-100/(1+ag/al);
 for(let i=n;i<g.length;i++){ag=(ag*(n-1)+g[i])/n;al=(al*(n-1)+l[i])/n;o[i+1]=al==0?100:100-100/(1+ag/al)}return o}
function atr(c,n=14){const tr=[];for(let i=1;i<c.length;i++)tr.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));
 let a=sum(tr.slice(0,n))/n;for(const x of tr.slice(n))a=(a*(n-1)+x)/n;return a}
function divergBaixa(k,r,w=30){const s=k.slice(-w),q=r.slice(-w),m=w>>1,A=s.slice(0,m),B=s.slice(m),RA=q.slice(0,m),RB=q.slice(m);
 return Math.max(...B.map(x=>x.h))>Math.max(...A.map(x=>x.h))&&Math.max(...RB)<Math.max(...RA)}

function avaliar(d){const k=d4=d["4h"],c=k.map(x=>x.c),it=[],f0=x=>x.toFixed(0);
 const e20=ema(c,20),e50=ema(c,50),e200=ema(c,200),px=last(c),cur=last(k),prev=last(k,2);
 const tend=px>last(e200)&&last(e50)>last(e200),veto=px<=last(e200);
 it.push(["Tendência de alta 4H (preço e EMA50 acima da EMA200)",tend?25:0,25,`preço ${f0(px)}, EMA50 ${f0(last(e50))}, EMA200 ${f0(last(e200))}`]);
 let pb=false,pbDet="nenhum toque";
 for(let i=1;i<=3;i++){const cd=last(k,i);
  for(const[m,nm]of[[e20[e20.length-i],"EMA20"],[e50[e50.length-i],"EMA50"]]){
   if(m&&cd.l<=m*1.005&&cd.c>=m*0.99){pb=true;pbDet=`tocou a ${nm} há ${i} candle(s)`}}}
 it.push(["Pullback na EMA20/50 (últimos 3 candles)",pb?25:0,25,pbDet]);
 const ret=cur.c>prev.h&&cur.c>cur.o;
 it.push(["Retomada (fechou acima da máxima anterior)",ret?20:0,20,`fechou ${f0(cur.c)} vs máx. anterior ${f0(prev.h)}`]);
 const r=rsi(c),rl=last(r),dv=divergBaixa(k,r);
 it.push(["RSI 4H entre 40-65, sem divergência de baixa",rl>=40&&rl<=65&&!dv?15:0,15,`RSI ${rl.toFixed(1)}, divergência: ${dv?"sim":"não"}`]);
 const vols=k.map(x=>x.v),vm=sum(vols.slice(-21,-1))/20;
 it.push(["Volume acima da média de 20",last(vols)>vm?15:0,15,`vol ${last(vols).toFixed(1)} vs média ${vm.toFixed(1)}`]);
 return[sum(it.map(i=>i[1])),it,veto]}

function plano(d){const k=d["4h"],e=last(k).c,a=atr(k),w=k.slice(-4);
 const stop=Math.min(...w.map(x=>x.l))-0.25*a;
 if(e-stop<=0)return null;const risco=e-stop,pct=risco/e*100;
 if(pct<0.3||pct>4)return null;const rr=0.5*1.5+0.5*3;if(rr<CFG.rrMin)return null;
 return{e,stop,tp1:e+1.5*risco,tp2:e+3*risco,pct,rr,pos:saldo>0?Math.min(saldo*CFG.risco/(risco/e),saldo):null}}

function notify(t,b){try{navigator.vibrate&&navigator.vibrate([200,100,200]);
 if("Notification"in window&&Notification.permission=="granted"){
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:"icon-192.png"}));
  else new Notification(t,{body:b})}}catch(e){}}

function renderDia(){const s=load(),bl=bloqueio(s);
 $("dia").innerHTML=`<h2>Hoje</h2>
 <div class="chips" style="margin-top:8px"><span class="chip">Stops: ${s.stops}/${CFG.maxStops}</span><span class="chip">Resultado: ${s.pnl.toFixed(2)}%</span><span class="chip">Sinais: ${s.sinais}/${CFG.maxSinais}</span></div>
 <div style="margin-top:8px;color:${bl?"var(--bad)":"var(--ok)"}">${bl||"Operação liberada"}</div>
 <div class="row"><input id="saldo" type="number" inputmode="decimal" placeholder="Saldo em USDT" value="${saldo||""}"><input id="pct" type="number" inputmode="decimal" step="0.1" placeholder="% do saldo" value="1"></div>
 <div class="row"><button class="r" onclick="ajusta('stop')">Registrar stop</button><button class="g" onclick="ajusta('gain')">Registrar ganho</button></div>
 <div class="row"><button class="s" onclick="alertas()">Ativar alertas</button><button class="s" onclick="testa()">Testar alerta</button></div>
 <div class="row"><button class="s" onclick="zera()">Zerar dia</button></div>`;
 $("saldo").onchange=e=>{saldo=+e.target.value||0;ls.set("aq_saldo",saldo)}}
function ajusta(t){const v=Math.abs(parseFloat($("pct").value)||1),s=load();
 if(t=="stop"){s.stops++;s.pnl-=v}else s.pnl+=v;save(s);renderDia()}
function zera(){if(confirm("Zerar o estado de hoje?")){ls.del("aq2_state");renderDia()}}
function alertas(){if(!("Notification"in window))return alert("Este navegador não suporta notificações.");
 Notification.requestPermission().then(p=>alert(p=="granted"?"Alertas ativados. Eles funcionam com o app aberto.":"Permissão negada nas configurações do navegador."))}
function testa(){notify("Teste de alerta","Se você recebeu isso, as notificações estão funcionando.");
 if(!("Notification"in window)||Notification.permission!="granted")alert("Toque antes em Ativar alertas e permita as notificações.");else alert("Alerta de teste enviado.")}

const fmt=x=>x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const hm=t=>new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
function compraHtml(L){const vt=CFG.veto&&L.veto,c=L.score>=CFG.scoreMin&&!vt;
 return `<div class="sc"><b>Compra</b><div class="bar"><i class="${c?"hi":""}" style="width:${L.score}%"></i></div><span class="num">${L.score}</span></div>
 ${vt?'<div class="v">Veto: preço abaixo da EMA 200 do 4H</div>':""}
 <details><summary>Critérios</summary><ul>${L.it.map(i=>`<li>${i[0]}: <b>${i[1]}/${i[2]}</b> — ${i[3]}</li>`).join("")}</ul></details>`}
function sigHtml(sig){const p=sig.p;return `<div class="sig">${sig.pre?`<div style="color:var(--acc)"><b>PRÉ-AVISO</b> — o candle de 4H fecha às ${hm(sig.fecha)}. Só vale se confirmar no fechamento.</div>`:`<div class="mut">Candle de 4H fechado às ${hm(sig.fecha)} — entrada a partir daqui</div>`}<b>COMPRAR — score ${sig.score}/100</b>
 <table><tr><td>Entrada</td><td>${fmt(p.e)}</td></tr><tr><td>Stop loss</td><td>${fmt(p.stop)} (${p.pct.toFixed(2)}%)</td></tr>
 <tr><td>TP1 (vender metade)</td><td>${fmt(p.tp1)}</td></tr><tr><td>TP2</td><td>${fmt(p.tp2)}</td></tr>
 <tr><td>R/R médio</td><td>1:${p.rr.toFixed(2)}</td></tr><tr><td>Posição (risco 1%)</td><td>${p.pos?fmt(p.pos)+" USDT":"informe o saldo"}</td></tr></table>
 <div class="drift" data-s="${sig.sym}" data-e="${p.e}" style="margin-top:6px;font-size:13px"></div><div class="mut" style="margin-top:6px">Confirme manualmente e mova o stop para a entrada após o TP1.</div></div>`}

const PRE={};
function avisaPre(sym,score,p,f){const k=sym+f;if(PRE[k])return;PRE[k]=1;
 notify(`PRÉ-AVISO ${sym} COMPRA ${score}/100`,`Candle 4H fecha às ${hm(f)}. Se confirmar: entrada ~${fmt(p.e)} | Stop ${fmt(p.stop)} | TP1 ${fmt(p.tp1)}`)}

async function scan(pre){if(busy)return;busy=true;$("go").disabled=true;$("upd").textContent="Analisando…";
 const s=load(),res=await Promise.all(CFG.symbols.map(async sym=>{try{return{sym,d:{"4h":await klines(sym,pre)}}}catch(e){return{sym,err:e.message}}}));
 let html="";const bl0=bloqueio(s);if(bl0)html+=`<div class="card warn">SEM ENTRADA — AGUARDAR. ${bl0}</div>`;
 for(const r of res){
  if(r.err){html+=`<div class="card warn"><b>${r.sym}</b><br>${r.err}<br><span class="mut">Verifique a internet ou desligue a VPN.</span></div>`;continue}
  const[score,it,veto]=avaliar(r.d),L={score,it,veto},marca=last(r.d["4h"]).t,fecha=marca+DUR4;
  let sig=null,aviso="";
  const liberado=!(CFG.veto&&veto);
  if(liberado&&score>=CFG.scoreMin){const p=plano(r.d),novo=s.ultimo[r.sym]!==marca;
   if(!p)aviso="Score ok, mas stop/R-R não passa nos filtros. Aguardar.";
   else if(!novo||!bloqueio(s)){sig={score,p,pre,fecha,sym:r.sym};
    if(pre)avisaPre(r.sym,score,p,fecha);
    else if(novo){s.ultimo[r.sym]=marca;s.sinais++;save(s);addHist(r.sym,score,p);
     notify(`${r.sym} COMPRA ${score}/100`,`Entrada ${hm(fecha)} a ${fmt(p.e)} | Stop ${fmt(p.stop)} | TP1 ${fmt(p.tp1)}`)}}}
  else{
   if(liberado&&score>=60&&!pre&&s.ultObs[r.sym]!==marca){s.ultObs[r.sym]=marca;save(s);addObs(r.sym,score,last(r.d["4h"]).c)}
   const f=it.filter(i=>i[1]<i[2]).map(i=>`${i[0]} (${i[1]}/${i[2]})`);
   aviso=(score>=60&&liberado?`Quase sinal (${score}/${CFG.scoreMin}) — registrado em Observação. `:"")+"Sem entrada — aguardar. Falta: "+(f.join(", ")||"veto da EMA200")}
  html+=`<div class="card"><div style="display:flex;justify-content:space-between"><h2>${r.sym.slice(0,-4)}/${r.sym.slice(-4)}</h2><span class="px" data-s="${r.sym}">${fmt(LIVE[r.sym]||last(r.d["4h"]).c)}</span></div><div class="mut" style="font-size:12px">Preço ao vivo · candle de 4H ${pre?"em formação, fecha":"fechado"} às ${hm(marca+(pre?DUR4:DUR4))} (${fmt(last(r.d["4h"]).c)})</div>
  ${compraHtml(L)}${sig?sigHtml(sig):`<div class="mut" style="margin-top:8px">${aviso}</div>`}</div>`}
 $("out").innerHTML=html;Object.keys(LIVE).forEach(k=>setPx(k,LIVE[k]));renderDia();lastScan=Date.now();
 $("upd").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 busy=false;$("go").disabled=false}

function addHist(sym,score,p){const h=ls.get("aq2_hist",[]);h.unshift({t:Date.now(),sym,score,e:p.e,stop:p.stop,tp1:p.tp1,tp2:p.tp2});ls.set("aq2_hist",h.slice(0,30));renderHist()}
function addObs(sym,score,px){const o=ls.get("aq2_obs",[]);o.unshift({t:Date.now(),sym,score,px});ls.set("aq2_obs",o.slice(0,30));renderHist()}
function renderHist(){const h=ls.get("aq2_hist",[]),o=ls.get("aq2_obs",[]);
 $("hist").innerHTML=`<h2>Histórico de sinais</h2>`+(h.length?h.slice(0,10).map(x=>`<div style="margin-top:8px;font-size:13px"><b>${x.sym.slice(0,-4)} COMPRA</b> ${x.score}/100 — ${new Date(x.t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}<br><span class="mut">Entrada ${fmt(x.e)} | Stop ${fmt(x.stop)} | TP1 ${fmt(x.tp1)} | TP2 ${fmt(x.tp2)}</span></div>`).join(""):`<div class="mut" style="margin-top:6px">Nenhum sinal registrado ainda.</div>`)
 +`<h2 style="margin-top:14px">Observação — não operar</h2><div class="mut" style="font-size:12px">Sinais com nota 60 até abaixo da mínima. Só para auditoria.</div>`
 +(o.length?o.slice(0,10).map(x=>`<div class="obs"><b>${x.sym.slice(0,-4)}</b> nota ${x.score} — ${new Date(x.t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · preço ${fmt(x.px)}</div>`).join(""):`<div class="mut" style="margin-top:6px">Nada registrado.</div>`)}

function renderCfg(){$("cfg").innerHTML=`<h2>Ajustes</h2><div class="row"><label class="mut">Nota mínima para avisar</label><select id="smin" onchange="setCfg()">${[70,75,80,85,90].map(v=>`<option${v==CFG.scoreMin?" selected":""}>${v}</option>`).join("")}</select></div><div class="row"><label class="mut"><input type="checkbox" id="sveto" ${CFG.veto?"checked":""} onchange="setCfg()" style="width:auto"> Exigir preço acima da EMA 200 do 4H (recomendado)</label></div><p class="mut" style="margin:6px 0 0">Análise no fechamento de cada candle de 4H (horários fixos da Binance). Pré-aviso 15 minutos antes do fechamento. Sinais são raros nesta estratégia: dias sem nada é o comportamento esperado.</p>`}
function setCfg(){CFG.scoreMin=+$("smin").value;CFG.veto=$("sveto").checked;ls.set("aq2_min",CFG.scoreMin);ls.set("aq2_veto",CFG.veto);scan(false)}

function renderBt(){$("bt").innerHTML=`<h2>Backtest</h2><p class="mut" style="margin:6px 0 10px">Reproduz as regras V2 (só compra, 4H) no histórico da Binance (~5 meses, BTC e ETH): quantos sinais teria dado e como teriam se saído.</p><div class="row"><button id="btgo" onclick="backtest(0)">Rodar backtest</button><button id="btcmp" class="s" onclick="backtest(1)">Comparar notas</button></div><div id="btm" class="mut" style="margin-top:8px"></div><div id="btr">${ls.get("aq2_bt","")}</div>`}
async function hist4(sym,n){let out=[],end=null,first=true;
 while(out.length<n){const q=`symbol=${sym}&interval=4h&limit=1000`+(end?`&endTime=${end}`:"");let raw=null;
  for(const h of HOSTS){try{const r=await fetch(`${h}/api/v3/klines?${q}`);if(!r.ok)throw 0;raw=await r.json();break}catch(e){}}
  if(!raw)throw new Error(`Falha ao buscar histórico de ${sym}`);if(!raw.length)break;
  const rows=raw.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
  if(first){rows.pop();first=false}out=rows.concat(out);end=rows[0].t-1}
 return out.slice(-n)}
function simula(k,i,p){const R=p.e-p.stop;let est=0;
 for(let j=i+1;j<Math.min(k.length,i+61);j++){const c=k[j];
  if(est==0){if(c.l<=p.stop)return{r:-1,j};if(c.h>=p.tp1)est=1}
  else{if(c.l<=p.e)return{r:0.75,j};if(c.h>=p.tp2)return{r:2.25,j}}}
 const jj=Math.min(k.length-1,i+60),x=(k[jj].c-p.e)/R;return{r:est?0.75+0.5*x:x,j:jj}}
let BTD=null;
async function btLoad(msg){if(BTD)return BTD;const B={};
 for(const sym of CFG.symbols){msg(`Baixando histórico de ${sym}…`);
  const k4=await hist4(sym,1000),cand=[];
  for(let i=200;i<k4.length-1;i++){
   if(i%100==0){msg(`${sym}: analisando ${Math.round(i/k4.length*100)}%`);await new Promise(r=>setTimeout(r))}
   const d={"4h":k4.slice(Math.max(0,i-499),i+1)},[score,it,veto]=avaliar(d);
   if(score>=60)cand.push({i,score,veto,p:plano(d)})}
  B[sym]={k4,cand}}
 B.ini=B[CFG.symbols[0]].k4[200].t;B.fim=last(B[CFG.symbols[0]].k4).t;BTD=B;return B}
function btRun(thr){const T=[];
 for(const sym of CFG.symbols){const{k4,cand}=BTD[sym],dia={};let livre=0;
  for(const c of cand){if(c.i<livre)continue;
   if(c.score<thr||(CFG.veto&&c.veto)||!c.p)continue;
   const dk=new Date(k4[c.i].t).toISOString().slice(0,10),D=dia[dk]||(dia[dk]={stops:0,sinais:0});
   if(D.stops>=CFG.maxStops||D.sinais>=CFG.maxSinais)continue;
   D.sinais++;const res=simula(k4,c.i,c.p);if(res.r<0)D.stops++;
   T.push({sym,t:k4[c.i].t,score:c.score,r:res.r,net:res.r-0.002/(c.p.pct/100)});livre=res.j+1}}
 return T}
async function backtest(cmp){const b1=$("btgo"),b2=$("btcmp"),msg=t=>{$("btm").textContent=t};b1.disabled=b2.disabled=true;
 try{const B=await btLoad(msg);
  const calc=a=>{let eq=0,pk=0,dd=0;for(const x of a){eq+=x.net;pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq)}return{n:a.length,w:a.filter(x=>x.net>0).length,sum:eq,dd}};
  const fR=v=>(v>=0?"+":"")+v.toFixed(1)+"R",dt=t=>new Date(t).toLocaleDateString("pt-BR"),pc=x=>x.n?Math.round(x.w/x.n*100)+"%":"–";
  const per=`Período: ${dt(B.ini)} a ${dt(B.fim)}. Só compra. Taxa de 0,1% por lado e limites do dia aplicados. EMA 200 ${CFG.veto?"exigida":"ignorada"}. 1R = valor arriscado (1% do saldo).`;
  let h;
  if(cmp){h=`<div class="mut" style="margin-top:8px">${per}</div><table class="t"><tr><th>Nota mín.</th><th>Sinais</th><th>Acertos</th><th>Resultado</th></tr>`+[60,70,75,80,85,90].map(v=>{const x=calc(btRun(v));return `<tr><td>${v}</td><td>${x.n}</td><td>${pc(x)}</td><td>${fR(x.sum)}</td></tr>`}).join("")+`</table><p class="mut" style="margin-top:8px">Cuidado: escolher a nota que foi melhor num único período é ajustar o sistema ao passado (overfitting).</p>`}
  else{const T=btRun(CFG.scoreMin),rows=[...CFG.symbols.map(y=>[y.slice(0,-4),calc(T.filter(x=>x.sym==y))]),["Total",calc(T)]];
   h=`<div class="mut" style="margin-top:8px">${per} Nota mínima: ${CFG.scoreMin}.</div><table class="t"><tr><th></th><th>Sinais</th><th>Acertos</th><th>Resultado</th><th>Queda máx.</th></tr>${rows.map(([n,x])=>`<tr><td>${n}</td><td>${x.n}</td><td>${pc(x)}</td><td>${fR(x.sum)}</td><td>-${x.dd.toFixed(1)}R</td></tr>`).join("")}</table>`;
   h+=T.length?`<div class="mut" style="margin-top:8px">Últimas operações:</div>`+T.slice(-8).reverse().map(x=>`<div style="font-size:13px;margin-top:4px">${dt(x.t)} ${x.sym.slice(0,-4)} compra (${x.score}) → <b style="color:${x.net>0?"var(--ok)":"var(--bad)"}">${fR(x.net)}</b></div>`).join(""):`<p class="mut">Nenhum sinal no período com essa nota.</p>`;
   h+=`<p class="mut" style="margin-top:8px">Um único período e regime de mercado não provam nada. Compare com a V1 antes de concluir.</p>`}
  $("btr").innerHTML=h;ls.set("aq2_bt",h);msg("Concluído.")}
 catch(e){msg("Erro: "+e.message+". Verifique a internet ou desligue a VPN.")}
 b1.disabled=b2.disabled=false}

 document.querySelectorAll(`.px[data-s="${sym}"]`).forEach(e=>e.textContent=fmt(v));
 document.querySelectorAll(`.drift[data-s="${sym}"]`).forEach(e=>{const en=+e.dataset.e,d=(v-en)/en*100,velho=Math.abs(d)>0.8;
