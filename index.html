<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1520">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agente Quant</title>
<style>
:root{--bg:#0d1520;--card:#15202e;--bd:#25354a;--tx:#e8edf3;--mut:#8497ad;--ok:#2fd28c;--bad:#ff5a6e;--acc:#f0b90b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;margin:auto}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.warn{border-color:var(--bad);color:var(--bad)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#1a1400;font-weight:600}
button.s{background:#25354a;color:var(--tx)}button.r{background:var(--bad);color:#fff}button.g{background:var(--ok);color:#04230f}
button:disabled{opacity:.5}
input{font:inherit;width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row>*{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:13px}
.sc{display:flex;align-items:center;gap:8px;margin-top:8px}.sc b{width:62px}.bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mut)}
.bar i.hi{background:var(--ok)}.num{width:44px;text-align:right}
details{margin-top:6px;font-size:13px;color:var(--mut)}li{margin:3px 0}
.sig{border:2px solid var(--ok);border-radius:10px;padding:10px;margin-top:10px;background:#0f2a22}
.sig table{width:100%;border-collapse:collapse}.sig td{padding:2px 0}.sig td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.v{color:var(--bad);font-size:12px}
</style></head><body>
<div class="top"><div><h1>Agente Quant</h1><div class="mut" id="upd">Aguardando análise…</div></div>
<button id="go">Analisar</button></div>

<div class="card" id="dia"></div>
<div id="out"></div>
<p class="mut">Só avisa — não executa ordens. Você confirma e opera na Binance. Não é recomendação de investimento.</p>

<script>
const CFG={symbols:["BTCUSDT","ETHUSDT"],risco:0.01,perdaMax:2,maxStops:2,maxSinais:3,scoreMin:85,rrMin:2,scanMs:300000};
const HOSTS=["https://api.binance.com","https://data-api.binance.vision"];
const $=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let saldo=+ls.get("aq_saldo",0)||0,lastScan=0,busy=false;
const sum=a=>a.reduce((x,y)=>x+y,0),last=(a,i=1)=>a[a.length-i];
const hoje=()=>new Date().toLocaleDateString("sv");
function load(){let s=ls.get("aq_state",{});if(s.data!==hoje())s={data:hoje(),stops:0,pnl:0,sinais:0,ultimo:{}};return s}
const save=s=>ls.set("aq_state",s);
function bloqueio(s){
 if(s.stops>=CFG.maxStops)return `${s.stops} stops no dia: PARE, sem entrada nova.`;
 if(s.pnl<=-CFG.perdaMax)return `Perda do dia ${s.pnl.toFixed(2)}% atingiu o limite de ${CFG.perdaMax}%.`;
 if(s.sinais>=CFG.maxSinais)return `Limite de ${CFG.maxSinais} sinais no dia atingido.`;
 return null}

async function klines(sym,tf){let err;
 for(const h of HOSTS){try{const r=await fetch(`${h}/api/v3/klines?symbol=${sym}&interval=${tf}&limit=500`);
  if(!r.ok)throw new Error("HTTP "+r.status);const raw=await r.json();
  return raw.slice(0,-1).map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}))}catch(e){err=e}}
 throw new Error(`Falha ao buscar ${sym} ${tf}: ${err&&err.message}`)}

function ema(v,n){const k=2/(n+1);let e=sum(v.slice(0,n))/n;const o=Array(n-1).fill(null);o.push(e);for(let i=n;i<v.length;i++){e=v[i]*k+e*(1-k);o.push(e)}return o}
function rsi(v,n=14){const o=Array(v.length).fill(null),g=[],l=[];
 for(let i=1;i<v.length;i++){g.push(Math.max(v[i]-v[i-1],0));l.push(Math.max(v[i-1]-v[i],0))}
 let ag=sum(g.slice(0,n))/n,al=sum(l.slice(0,n))/n;o[n]=al==0?100:100-100/(1+ag/al);
 for(let i=n;i<g.length;i++){ag=(ag*(n-1)+g[i])/n;al=(al*(n-1)+l[i])/n;o[i+1]=al==0?100:100-100/(1+ag/al)}return o}
function atr(c,n=14){const tr=[];for(let i=1;i<c.length;i++)tr.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));
 let a=sum(tr.slice(0,n))/n;for(const x of tr.slice(n))a=(a*(n-1)+x)/n;return a}
function pivots(c,n=3){const hi=[],lo=[];for(let i=n;i<c.length-n;i++){let h=true,l=true;
 for(let j=i-n;j<=i+n;j++){if(c[i].h<c[j].h)h=false;if(c[i].l>c[j].l)l=false}
 if(h)hi.push(c[i].h);if(l)lo.push(c[i].l)}return[hi,lo]}
function diverg(k,r,lado,w=30){const s=k.slice(-w),q=r.slice(-w),m=w>>1,A=s.slice(0,m),B=s.slice(m),RA=q.slice(0,m),RB=q.slice(m);
 return lado=="long"?Math.max(...B.map(x=>x.h))>Math.max(...A.map(x=>x.h))&&Math.max(...RB)<Math.max(...RA)
 :Math.min(...B.map(x=>x.l))<Math.min(...A.map(x=>x.l))&&Math.min(...RB)>Math.min(...RA)}

function avaliar(lado,d){const s=lado=="long"?1:-1,it=[],f0=x=>x.toFixed(0);
 const c4=d["4h"].map(x=>x.c),a9=ema(c4,9),a21=ema(c4,21),a200=ema(c4,200);
 const tend=s*(last(c4)-last(a21))>0&&s*(last(a9)-last(a21))>0&&s*(last(a21)-last(a21,4))>0;
 it.push(["Tendência 4H",tend?25:0,25,`preço ${f0(last(c4))}, EMA9 ${f0(last(a9))}, EMA21 ${f0(last(a21))}`]);
 const c1=d["1h"].map(x=>x.c),b200=ema(c1,200),ok4=s*(last(c4)-last(a200))>0,ok1=s*(last(c1)-last(b200))>0,veto=!ok4;
 it.push(["EMA 200 (4H e 1H)",ok4&&ok1?20:0,20,`EMA200 4H ${f0(last(a200))} | 1H ${f0(last(b200))}`]);
 const k=d["15m"],c15=k.map(x=>x.c),f9=ema(c15,9),f21=ema(c15,21),n=f9.length;let cruz=false;
 if(s*(last(f9)-last(f21))>0)for(let i=n-6;i<n;i++)if(s*(f9[i]-f21[i])>0&&s*(f9[i-1]-f21[i-1])<=0)cruz=true;
 it.push(["Cruzamento EMA9/21 (15m)",cruz?15:0,15,`EMA9 ${f0(last(f9))} vs EMA21 ${f0(last(f21))}`]);
 const r=rsi(c15),[lo,hi]=lado=="long"?[40,65]:[35,60],dv=diverg(k,r,lado),rl=last(r);
 it.push(["RSI 15m sem divergência",rl>=lo&&rl<=hi&&!dv?15:0,15,`RSI ${rl.toFixed(1)} (faixa ${lo}-${hi}), divergência: ${dv?"sim":"não"}`]);
 const vols=k.map(x=>x.v),vm=sum(vols.slice(-21,-1))/20,w=k.slice(-21,-1),cur=last(k),prev=last(k,2);
 const rompe=lado=="long"?cur.c>Math.max(...w.map(x=>x.h)):cur.c<Math.min(...w.map(x=>x.l));
 it.push(["Volume > média no rompimento",last(vols)>vm&&rompe?15:0,15,`vol ${last(vols).toFixed(1)} vs média ${vm.toFixed(1)}, rompimento: ${rompe?"sim":"não"}`]);
 const[hp,lp]=pivots(d["1h"].slice(-150)),px=cur.c,perto=[...hp,...lp].some(v=>Math.abs(px-v)/px<=0.005);
 const conf=lado=="long"?cur.c>cur.o&&cur.c>prev.h:cur.c<cur.o&&cur.c<prev.l;
 it.push(["Suporte/resistência 1H + candle",perto&&conf?10:0,10,`nível a ≤0,5%: ${perto?"sim":"não"}, candle confirma: ${conf?"sim":"não"}`]);
 return[sum(it.map(i=>i[1])),it,veto]}

function plano(lado,d){const s=lado=="long"?1:-1,k=d["15m"],e=last(k).c,a=atr(k),w=k.slice(-12);
 const stop=lado=="long"?Math.min(...w.map(x=>x.l))-0.25*a:Math.max(...w.map(x=>x.h))+0.25*a;
 if(s*(e-stop)<=0)return null;const risco=Math.abs(e-stop),pct=risco/e*100;
 if(pct<0.15||pct>2.5)return null;const rr=0.5*1.5+0.5*3;if(rr<CFG.rrMin)return null;
 return{e,stop,tp1:e+s*1.5*risco,tp2:e+s*3*risco,pct,rr,pos:saldo>0?Math.min(saldo*CFG.risco/(risco/e),saldo):null}}

function notify(t,b){try{navigator.vibrate&&navigator.vibrate([200,100,200]);
 if("Notification"in window&&Notification.permission=="granted"){
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:"icon-192.png"}));
  else new Notification(t,{body:b})}}catch(e){}}

function renderDia(){const s=load(),bl=bloqueio(s);
 $("dia").innerHTML=`<h2>Hoje</h2>
 <div class="chips" style="margin-top:8px"><span class="chip">Stops: ${s.stops}/${CFG.maxStops}</span><span class="chip">Resultado: ${s.pnl.toFixed(2)}%</span><span class="chip">Sinais: ${s.sinais}/${CFG.maxSinais}</span></div>
 <div style="margin-top:8px;color:${bl?"var(--bad)":"var(--ok)"}">${bl||"Operação liberada"}</div>
 <div class="row"><input id="saldo" type="number" inputmode="decimal" placeholder="Saldo em USDT" value="${saldo||""}"><input id="pct" type="number" inputmode="decimal" step="0.1" placeholder="% do saldo" value="1"></div>
 <div class="row"><button class="r" onclick="ajusta('stop')">Registrar stop</button><button class="g" onclick="ajusta('gain')">Registrar ganho</button></div>
 <div class="row"><button class="s" onclick="alertas()">Ativar alertas</button><button class="s" onclick="zera()">Zerar dia</button></div>`;
 $("saldo").onchange=e=>{saldo=+e.target.value||0;ls.set("aq_saldo",saldo)}}
function ajusta(t){const v=Math.abs(parseFloat($("pct").value)||1),s=load();
 if(t=="stop"){s.stops++;s.pnl-=v}else s.pnl+=v;save(s);renderDia()}
function zera(){if(confirm("Zerar o estado de hoje?")){ls.del("aq_state");renderDia()}}
function alertas(){if(!("Notification"in window))return alert("Este navegador não suporta notificações.");
 Notification.requestPermission().then(p=>alert(p=="granted"?"Alertas ativados. Eles funcionam com o app aberto.":"Permissão negada nas configurações do navegador."))}

const fmt=x=>x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function ladoHtml(nome,L,sig){const c=L.score>=CFG.scoreMin&&!L.veto;
 return `<div class="sc"><b>${nome}</b><div class="bar"><i class="${c?"hi":""}" style="width:${L.score}%"></i></div><span class="num">${L.score}</span></div>
 ${L.veto?'<div class="v">Veto: contra a EMA 200 do 4H</div>':""}
 <details><summary>Critérios</summary><ul>${L.it.map(i=>`<li>${i[0]}: <b>${i[1]}/${i[2]}</b> — ${i[3]}</li>`).join("")}</ul></details>`}
function sigHtml(sig){const p=sig.p;return `<div class="sig"><b>${sig.lado=="long"?"COMPRAR":"VENDER (exige margem/futuros)"} — score ${sig.score}/100</b>
 <table><tr><td>Entrada</td><td>${fmt(p.e)}</td></tr><tr><td>Stop loss</td><td>${fmt(p.stop)} (${p.pct.toFixed(2)}%)</td></tr>
 <tr><td>TP1 (50% da posição)</td><td>${fmt(p.tp1)}</td></tr><tr><td>TP2</td><td>${fmt(p.tp2)}</td></tr>
 <tr><td>R/R médio</td><td>1:${p.rr.toFixed(2)}</td></tr><tr><td>Posição (risco 1%)</td><td>${p.pos?fmt(p.pos)+" USDT":"informe o saldo"}</td></tr></table>
 <div class="mut" style="margin-top:6px">Confirme manualmente e mova o stop para a entrada após o TP1.</div></div>`}

async function scan(){if(busy)return;busy=true;$("go").disabled=true;$("upd").textContent="Analisando…";
 const s=load(),res=await Promise.all(CFG.symbols.map(async sym=>{try{const d={};
  await Promise.all(["4h","1h","15m"].map(async tf=>{d[tf]=await klines(sym,tf)}));return{sym,d}}catch(e){return{sym,err:e.message}}}));
 let html="";const bl0=bloqueio(s);if(bl0)html+=`<div class="card warn">SEM ENTRADA — AGUARDAR. ${bl0}</div>`;
 for(const r of res){
  if(r.err){html+=`<div class="card warn"><b>${r.sym}</b><br>${r.err}<br><span class="mut">Verifique a internet ou desligue a VPN.</span></div>`;continue}
  const L={};let melhor=null;
  for(const lado of["long","short"]){const[score,it,veto]=avaliar(lado,r.d);L[lado]={score,it,veto};if(!veto&&(!melhor||score>melhor.score))melhor={lado,score,it}}
  let sig=null,aviso="";
  if(melhor&&melhor.score>=CFG.scoreMin){const marca=last(r.d["15m"]).t,p=plano(melhor.lado,r.d),novo=s.ultimo[r.sym]!==marca;
   if(!p)aviso="Score ok, mas stop/R-R não passa nos filtros. Aguardar.";
   else if(!novo||!bloqueio(s)){sig={...melhor,p};
    if(novo){s.ultimo[r.sym]=marca;s.sinais++;save(s);notify(`${r.sym} ${melhor.lado=="long"?"COMPRA":"VENDA"} ${melhor.score}/100`,`Entrada ${fmt(p.e)} | Stop ${fmt(p.stop)} | TP1 ${fmt(p.tp1)}`)}}}
  else{const f=melhor?melhor.it.filter(i=>i[1]<i[2]).map(i=>`${i[0]} (${i[1]}/${i[2]})`):[];
   aviso="Sem entrada — aguardar. Falta: "+(f.join(", ")||"EMA200 a favor")}
  html+=`<div class="card"><div style="display:flex;justify-content:space-between"><h2>${r.sym.slice(0,-4)}/${r.sym.slice(-4)}</h2><span>${fmt(last(r.d["15m"]).c)}</span></div>
  ${ladoHtml("Compra",L.long)}${ladoHtml("Venda",L.short)}${sig?sigHtml(sig):`<div class="mut" style="margin-top:8px">${aviso}</div>`}</div>`}
 $("out").innerHTML=html;renderDia();lastScan=Date.now();
 $("upd").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 busy=false;$("go").disabled=false}

$("go").onclick=scan;renderDia();scan();setInterval(scan,CFG.scanMs);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-lastScan>120000)scan()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
