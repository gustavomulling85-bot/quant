
name: Quant - Backtest Historico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar teste interno
        run: node quant-backtest.js --selftest

      - name: Executar backtest historico
        run: node quant-backtest.js

      - name: Salvar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-quant-backtest
          path: |
            quant-backtest-results.json
            quant-backtest-report.md
          if-no-files-found: warn
